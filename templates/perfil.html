{% extends "base.html" %}
{% block titulo %}Mi perfil{% endblock %}
{% block contenido %}
<div class="card">
  <h2>Editar perfil</h2>
  <form method="post">
    <label>Nombre <input name="nombre" value="{{ g.user['nombre'] }}" required></label>
    <label>Correo <input name="email" type="email" value="{{ g.user['email'] }}" required></label>
    <p><button type="submit">Guardar cambios</button></p>
  </form>
</div>
<div class="card">
  <h2>Cambiar contraseña</h2>
  <form method="post" action="{{ url_for('cambiar_password') }}">
    <label>Contraseña actual <input name="actual" type="password" required></label>
    <label>Nueva contraseña <input name="nueva" type="password" required></label>
    <p><button type="submit">Actualizar contraseña</button></p>
  </form>
</div>
{% endblock %}
